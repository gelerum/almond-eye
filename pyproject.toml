[project]
name = "construction-monitor"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "openpyxl>=3.1,<4", "pillow>=11,<13", "python-multipart>=0.0.20,<1", "tzdata>=2025.1", "pyyaml>=6,<7"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
detector = ["ultralytics==8.4.113", "torch", "torchvision"]
experiment = ["ultralytics==8.4.113", "torch", "torchvision", "transformers==4.57.1", "huggingface-hub==0.36.0", "psutil"]
dvc = ["dvc[s3]>=3.67.1"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

# torch/torchvision под CUDA 12.6 — как в рабочем образе aorta-pure-hex-meshing.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
